<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Daily Challenge</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#101827;--muted:#667085;--line:#e5e7eb;--accent:#16a34a;--dark:#101827}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:88px}.top{padding:24px 18px 8px}.brand{font-weight:900;font-size:27px}.sub{color:var(--muted);margin-top:3px}
.page{display:none;padding:12px 16px}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:10px 0;box-shadow:0 4px 18px #1018270a}
.hero{background:linear-gradient(135deg,#101827,#193c32);color:#fff;border:0;padding:22px}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:800;opacity:.72}
h1,h2,h3,p{margin-top:0}h1{font-size:29px;line-height:1.05;margin:8px 0}h2{font-size:21px;margin-bottom:8px}h3{margin-bottom:5px}.muted{color:var(--muted)}.hero .muted{color:#cbd5d1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:16px;background:#f8fafc}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}
button{border:0;border-radius:14px;padding:13px 15px;font-weight:800;font-size:14px;cursor:pointer}.primary{background:var(--accent);color:#fff;width:100%;margin-top:12px}.secondary{background:#eef2f0;color:var(--text)}.danger{background:#fee2e2;color:#991b1b}
.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:#e9f7ef;color:#166534;font-weight:800;font-size:12px;margin:2px 3px 2px 0}.challenge-title{font-size:25px;font-weight:900;margin:8px 0}
.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:grid;gap:9px}.item{padding:14px;border:1px solid var(--line);border-radius:17px;background:#fff}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 7px calc(7px + env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;color:#667085;padding:8px 3px;font-size:11px}.nav button.active{color:#0f766e}.nav span{display:block;font-size:19px;margin-bottom:2px}
.sport{display:inline-block;margin:4px 4px 0 0;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff}.sport.selected{background:#dcfce7;border-color:#86efac;color:#166534}.small{font-size:12px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{height:34px;border-radius:9px;background:#f1f5f9;display:grid;place-items:center;font-size:11px}.day.done{background:#bbf7d0;color:#166534;font-weight:900}.day.today{outline:2px solid #16a34a}
.notice{padding:12px;border-radius:14px;background:#fff7ed;color:#9a3412;font-size:12px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">⚡ Daily Challenge</div><div class="sub">Elke dag één sportieve challenge.</div></header>
<main id="today" class="page active"></main>
<main id="challenges" class="page"></main>
<main id="progress" class="page"></main>
<main id="levels" class="page"></main>
<main id="profile" class="page"></main>
<nav class="nav">
<button data-page="today" class="active"><span>🏠</span>Vandaag</button>
<button data-page="challenges"><span>🏆</span>Challenges</button>
<button data-page="progress"><span>📈</span>Progress</button>
<button data-page="levels"><span>🔓</span>Levels</button>
<button data-page="profile"><span>👤</span>Profiel</button>
</nav>
</div>

<script>
const sports=["🫀 Conditie","💪 Kracht","🔥 HIIT","🥊 Boksen","🤸 Mobiliteit","🎯 Coördinatie","🏠 Full body","🧠 Skills"];

const dailyMotivations=[
"Sterk bezig! Morgen staat er weer een nieuwe challenge voor je klaar.",
"Lekker gedaan! Elke dag een kleine stap maakt je sterker.",
"Topper! Je streak groeit — blijf morgen weer in beweging.",
"Goed gewerkt! Vandaag afgevinkt, morgen weer een nieuwe uitdaging.",
"Je hebt het weer gedaan! Houd dit ritme vast.",
"Knap bezig! Consistentie maakt het verschil.",
"Weer een dag voltooid! Je bent lekker op weg.",
"Yes! Challenge geslaagd. Morgen wacht de volgende.",
"Sterke actie! Blijf bouwen aan je streak.",
"Goed bezig! Eén challenge per dag, stap voor stap.",
"Jij hebt vandaag je doel gehaald. Morgen gaan we verder!",
"Mooi werk! Je maakt van bewegen een gewoonte.",
"Challenge voltooid! Geef jezelf een momentje om trots te zijn.",
"Lekker! Je streak staat weer een dag sterker.",
"Goed gedaan! Blijf bewegen, blijf groeien.",
"Vandaag gepakt, morgen weer een nieuwe kans. Tot morgen!",
"Sterk afgerond! Je dagelijkse inzet telt.",
"Yes, weer een vinkje! Houd de reeks gaande.",
"Je bent vandaag in beweging gekomen — precies zoals het hoort.",
"Mooie dag, mooie challenge. Morgen weer!",
"Goed bezig! Je hoeft niet perfect te zijn, alleen consistent.",
"Weer een challenge van de lijst! Op naar morgen.",
"Krachtig gedaan! Je streak blijft leven.",
"Top! Vandaag verdiend, morgen ontdekken we wat er wacht.",
"Je hebt hem geflikt! Blijf lekker doorgaan.",
"Elke voltooide challenge telt. Vandaag weer eentje erbij!",
"Mooi volgehouden! Morgen staat er iets nieuws klaar.",
"Goed gedaan! Je toekomstige zelf gaat je bedanken.",
"Sterke finish voor vandaag. Morgen weer een frisse challenge!",
"Challenge klaar! Blijf trots op elke dag die je pakt."
];

function motivationForDate(date){
 const d=new Date(date+"T12:00:00");
 const start=new Date(d.getFullYear(),0,0);
 const day=Math.floor((d-start)/86400000);
 return dailyMotivations[(day-1)%dailyMotivations.length];
}

const levels=[
{min:0,max:6,name:"Rookie",icon:"🌱"},
{min:7,max:20,name:"Starter",icon:"🚀"},
{min:21,max:44,name:"Athlete",icon:"💪"},
{min:45,max:74,name:"Advanced",icon:"🔥"},
{min:75,max:119,name:"Pro",icon:"⚡"},
{min:120,max:179,name:"Elite",icon:"🏆"},
{min:180,max:99999,name:"Legend",icon:"👑"}
];

const pools={
"🫀 Conditie":[
["Joggen op de plaats","Jog rustig op de plaats en beweeg je armen mee."],
["High knees","Til je knieën afwisselend actief op."],
["Jumping jacks","Spring je voeten rustig uit elkaar en weer samen."],
["Mountain climbers","Breng je knieën afwisselend richting je borst."],
["Skater steps","Stap of spring gecontroleerd van links naar rechts."],
["Marcheren","Loop stevig op de plaats en gebruik je armen."],
["Step touch","Stap links en rechts en beweeg je armen mee."],
["Knieheffen + punches","Til je knieën op en maak rustige stoten in de lucht."],
["Fast feet","Maak korte, snelle stapjes op de plaats."],
["Lateral steps","Beweeg gecontroleerd twee stappen links en twee rechts."]
],
"💪 Kracht":[
["Push-ups","Doe nette push-ups; maak ze eventueel op knieën."],
["Wall sit","Zak tegen een muur en houd je positie vast."],
["Glute bridge","Duw je heupen rustig omhoog vanuit lig."],
["Calf raises","Kom rustig op je tenen en zak gecontroleerd terug."],
["Plank","Houd je lichaam recht en span je buik aan."],
["Side plank","Houd je lichaam in één lijn en wissel van zijde."],
["Bird dog","Strek afwisselend arm en tegenovergesteld been."],
["Dead bug","Beweeg tegenovergestelde arm en been gecontroleerd."],
["Triceps dips","Gebruik alleen een stevige, stabiele stoel en beweeg rustig."],
["Superman","Til armen en benen licht op vanuit buikligging; houd het gecontroleerd."]
],
"🔥 HIIT":[
["Jumping jack + plank","Wissel jumping jacks af met een korte plank."],
["High knees + push-up","Combineer knieheffen met rustige push-ups."],
["Mountain climber + marcheren","Wissel actief klimmen af met herstel op de plaats."],
["Skater + plank","Wissel zijwaartse beweging af met core."],
["Fast feet + squat","Wissel snelle voeten af met gecontroleerde squats."],
["Step touch + punches","Combineer zijwaartse stappen met punches."]
],
"🥊 Boksen":[
["Shadowboxing","Boks rustig in de lucht met gecontroleerde combinaties."],
["Jab-cross","Wissel een rechte linker- en rechterstoot af."],
["Footwork","Beweeg voor-, achter- en zijwaarts zonder je balans te verliezen."],
["Hook-combinaties","Oefen rustige hooks links en rechts."],
["Defence drill","Combineer stappen met lichte slips en ducking."],
["Jab + footwork","Maak een jab en beweeg direct een stap opzij."]
],
"🤸 Mobiliteit":[
["Heupmobiliteit","Maak rustige heupcirkels en gecontroleerde beenbewegingen."],
["Schoudermobiliteit","Maak rustige armcirkels en schouderbewegingen."],
["Enkelmobiliteit","Beweeg je enkels rustig door hun comfortabele bereik."],
["Bovenrug rotaties","Draai rustig vanuit je bovenrug zonder te forceren."],
["Dynamische stretch","Wissel rustige been-, heup- en armbewegingen af."],
["World's easiest flow","Beweeg rustig door een combinatie van heup-, schouder- en rugbewegingen."]
],
"🎯 Coördinatie":[
["Balans links/rechts","Sta afwisselend op één been en gebruik je armen voor balans."],
["Cross-crawl","Raak met je rechterhand je linkerknie en andersom."],
["Vierkant voetenwerk","Maak een klein vierkant met vier verschillende staprichtingen."],
["Reactie op richtingen","Noem links, rechts, voor of achter en reageer met een stap."],
["Ritme challenge","Wissel een snel en langzaam bewegingspatroon af."],
["Knie + elleboog","Breng afwisselend knie en tegenovergestelde elleboog samen."]
],
"🏠 Full body":[
["Squat + push-up","Wissel een squat af met een push-up."],
["Lunge + punch","Doe een gecontroleerde lunge en sluit af met twee punches."],
["Mountain climber + plank","Wissel mountain climbers af met een plank."],
["Jumping jack + squat","Combineer cardio met gecontroleerde kracht."],
["Glute bridge + dead bug","Wissel beide oefeningen rustig af."],
["High knees + push-up","Combineer conditie met bovenlichaam."],
["Step touch + wall sit","Wissel bewegen af met een korte wall sit."],
["Bear crawl + plank","Beweeg kort voor/achter en sluit af met plank."]
],
"🧠 Skills":[
["10 minuten voetenwerk","Maak een simpel patroon van voor, achter, links en rechts."],
["Reactie challenge","Geef jezelf willekeurige richtingen en reageer direct met een stap."],
["Balans challenge","Wissel 20 seconden links en rechts af met korte rust."],
["Ritme challenge","Maak drie bewegingspatronen en herhaal ze in verschillende tempo's."],
["Coördinatie flow","Combineer knieheffen, zijstappen en armbewegingen in één patroon."]
]
};

const formats=[
["Express",2,25,15],["Circuit",3,30,20],["Steady",3,40,20],
["Builder",4,30,20],["Endurance",4,40,20],["Challenge",5,35,20],
["Mix",3,45,25],["Longer",5,45,20]
];
const modifiers=[
"Blijf technisch netjes bewegen.","Houd alle rondes ongeveer even sterk.",
"Begin rustig en bouw iets op.","Focus op een vloeiende uitvoering.",
"Neem extra rust als dat nodig is.","Probeer zo weinig mogelijk stil te staan.",
"Voer alles gecontroleerd uit.","Maak de laatste ronde niet sneller dan je aankunt."
];

const challenges=[];
let id=1;
for(const [cat,items] of Object.entries(pools)){
 for(let a=0;a<items.length;a++){
  for(let b=0;b<items.length;b++){
   if(a===b && items.length>1) continue;
   for(let f=0;f<formats.length;f++){
    const [format,rounds,work,rest]=formats[f];
    for(let m=0;m<modifiers.length;m++){
     const one=items[a],two=items[b];
     const title=a===b?`${format}: ${one[0]}`:`${format}: ${one[0]} + ${two[0]}`;
     const desc=a===b
       ?`${rounds} rondes: ${work} sec ${one[0].toLowerCase()}, ${rest} sec rust. ${one[1]} ${modifiers[m]}`
       :`${rounds} rondes: ${work} sec ${one[0].toLowerCase()}, ${work} sec ${two[0].toLowerCase()}, daarna ${rest} sec rust. ${one[1]} ${two[1]} ${modifiers[m]}`;
     const mins=Math.max(3,Math.ceil(rounds*(work*(a===b?1:2)+rest)/60));
     let unlock=mins>=25?120:mins>=20?75:mins>=16?45:mins>=12?21:mins>=8?7:0;
     challenges.push(["c"+id++,cat,title,desc,mins,unlock,Math.min(6,2+Math.floor(mins/7))]);
    }
   }
  }
 }
}

const special=[
["🫀 Conditie","5 minuten zonder stil te staan","Beweeg 5 minuten aaneengesloten. Wissel marcheren, joggen en zijwaarts stappen af.",0,2,5],
["🫀 Conditie","10 minuten interval","40 sec actief bewegen + 20 sec rustig bewegen, 10 minuten lang.",7,3,10],
["🔥 HIIT","12 minuten mix","Wissel iedere minuut tussen cardio, benen en core.",21,4,12],
["🏠 Full body","15 minuten thuis","5 min cardio, 5 min kracht en 5 min core.",45,5,15],
["🏠 Full body","20 minuten sportmix","Wissel iedere 2 minuten tussen conditie, bovenlichaam, benen en core.",75,5,20],
["🥊 Boksen","6 rondes shadowboxing","6 rondes van 2 minuten: combinaties, footwork en verdediging afwisselen.",21,5,12],
["🤸 Mobiliteit","12 minuten sportmobility","Werk rustig aan enkels, heupen, bovenrug en schouders.",0,2,12],
["🧠 Skills","10 minuten voetenwerk","Maak een eenvoudig patroon met voor-, achter- en zijwaartse stappen.",0,2,10]
];
special.forEach((x,i)=>challenges.push(["s"+i,x[0],x[1],x[2],x[5],x[3],x[4]]));

const key="dailyChallengeV5";
let state=JSON.parse(localStorage.getItem(key)||"null")||{
streak:0,longest:0,total:0,points:0,completedDates:[],history:[],prefs:[...sports],lastChallenge:null
};
function save(){localStorage.setItem(key,JSON.stringify(state))}
function localDate(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dateNL(){return new Intl.DateTimeFormat("nl-NL",{weekday:"long",day:"numeric",month:"long"}).format(new Date())}
function level(){return levels.find(l=>state.streak>=l.min&&state.streak<=l.max)||levels.at(-1)}
function nextLevel(){return levels.find(l=>l.min>state.streak)}
function available(){
 let arr=challenges.filter(c=>c[5]<=state.streak);
 if(state.prefs.length && state.prefs.length<sports.length){
  const filtered=arr.filter(c=>state.prefs.includes(c[1]));
  if(filtered.length>30) arr=filtered;
 }
 const recent=state.history.slice(-10);
 const recentIds=new Set(recent.map(x=>x.id));
 const recentCats=new Set(recent.slice(-4).map(x=>x.category).filter(Boolean));
 let fresh=arr.filter(c=>!recentIds.has(c[0])&&!recentCats.has(c[1]));
 if(fresh.length<20) fresh=arr.filter(c=>!recentIds.has(c[0])&&c[0]!==state.lastChallenge);
 if(!fresh.length) fresh=arr.filter(c=>c[0]!==state.lastChallenge);
 return fresh.length?fresh:arr;
}
function daily(){
 const today=localDate();
 const same=state.history.find(x=>x.date===today);
 if(same)return challenges.find(c=>c[0]===same.id)||available()[0];
 const arr=available();
 return arr[Math.floor(Math.random()*arr.length)]||challenges[0];
}
function complete(){
 const c=daily(),today=localDate();
 if(state.completedDates.includes(today))return;
 const y=new Date();y.setDate(y.getDate()-1);
 state.streak=state.completedDates.includes(localDate(y))?state.streak+1:1;
 state.longest=Math.max(state.longest,state.streak);
 state.total++;state.points+=c[6];state.completedDates.push(today);
 state.history.push({date:today,id:c[0],title:c[2],category:c[1],points:c[6]});
 state.lastChallenge=c[0];save();render();
}
function streakProgress(){
 const n=nextLevel();
 if(!n)return{text:"Max level bereikt",pct:100};
 const span=n.min-level().min;
 return{text:`${state.streak}/${n.min} dagen`,pct:Math.max(0,Math.min(100,Math.round((state.streak-level().min+1)/span*100)))};
}
function renderToday(){
 const c=daily(),l=level(),n=nextLevel(),done=state.completedDates.includes(localDate()),pr=streakProgress();
 const challengeCard=done?`
 <section class="card" style="text-align:center;padding:28px 18px">
   <div style="font-size:46px">🎉</div>
   <h2>Goed gedaan!</h2>
   <p>Je hebt de challenge van vandaag voltooid.</p>
   <p class="muted"><b>${motivationForDate(localDate())}</b></p>
   <div class="pill">🔥 ${state.streak} dagen streak</div>
   <div class="pill">⭐ ${state.points} punten</div>
 </section>`:`
 <section class="card"><span class="pill">${c[1]}</span><span class="pill">${c[4]} min</span><span class="pill">${c[6]} punten</span>
 <div class="challenge-title">${c[2]}</div><p class="muted">${c[3]}</p>
 <p><b>Thuis</b> · Geen speciale apparatuur nodig</p>
 <button class="primary" onclick="complete()">Ik heb hem gedaan ✓</button></section>`;
 document.getElementById("today").innerHTML=`
 <section class="card hero"><div class="eyebrow">${dateNL()}</div><h1>${l.icon} ${l.name}</h1><p class="muted">Streak: <b>${state.streak} dagen</b> · ${state.points} punten</p></section>
 ${challengeCard}
 <section class="card"><div class="row"><b>Naar ${n?n.name:"Legend"}</b><span>${pr.text}</span></div><div class="progress" style="margin-top:10px"><i style="width:${pr.pct}%"></i></div></section>
 <section class="grid"><div class="stat"><b>${state.total}</b><span>voltooid</span></div><div class="stat"><b>${state.longest}</b><span>langste streak</span></div></section>
 <div class="notice">Kies een passend tempo, warm rustig op en pas een oefening aan als dat nodig is. Stop bij pijn of duizeligheid.</div>`;
}
function renderChallenges(){
 const done=[...state.history].reverse();
 document.getElementById("challenges").innerHTML=`
 <section class="card"><h2>🏆 Voltooide challenges</h2>
 <p class="muted">Hier staan alleen de challenges die jij hebt voltooid. Nieuwe challenges blijven verborgen.</p></section>
 ${done.length?`<section class="list">${done.map(h=>`<div class="item"><div class="row"><b>✓ ${h.title}</b><span>+${h.points}p</span></div><div class="small muted">${h.category} · ${h.date}</div></div>`).join("")}</section>`:
 `<section class="card"><p class="muted">Nog geen voltooide challenges. Je eerste verschijnt hier na je eerste challenge.</p></section>`}`;
}
function renderProgress(){
 const now=new Date(),y=now.getFullYear(),m=now.getMonth(),days=new Date(y,m+1,0).getDate();
 let cal="";
 for(let d=1;d<=days;d++){let dt=localDate(new Date(y,m,d));cal+=`<div class="day ${state.completedDates.includes(dt)?"done":""} ${d===now.getDate()?"today":""}">${d}</div>`}
 document.getElementById("progress").innerHTML=`
 <section class="card"><h2>📈 Jouw progress</h2><div class="grid">
 <div class="stat"><b>${state.streak}</b><span>huidige streak</span></div><div class="stat"><b>${state.longest}</b><span>langste streak</span></div>
 <div class="stat"><b>${state.total}</b><span>challenges</span></div><div class="stat"><b>${state.points}</b><span>punten</span></div></div></section>
 <section class="card"><h3>Deze maand</h3><div class="calendar">${cal}</div></section>
 <section class="card"><h3>Recent</h3>${state.history.slice(-8).reverse().map(h=>`<div class="item" style="margin:7px 0"><div class="row"><b>${h.title}</b><span>+${h.points}</span></div><div class="small muted">${h.category} · ${h.date}</div></div>`).join("")||"<p class='muted'>Nog niets voltooid.</p>"}</section>`;
}
function renderLevels(){
 document.getElementById("levels").innerHTML=`<section class="card"><h2>🔓 Levels</h2><p class="muted">Je ziet hier je voortgang. Welke challenge er morgen komt, blijft geheim.</p></section>`+
 levels.map(l=>`<section class="card"><div class="row"><div><h3>${l.icon} ${l.name}</h3><div class="small muted">${l.min===0?"Start":l.min+" dagen streak"}${l.max<99999?" – "+l.max:" +"}</div></div>${state.streak>=l.min?"✓":"🔒"}</div></section>`).join("");
}
function toggleSport(s){if(state.prefs.includes(s))state.prefs=state.prefs.filter(x=>x!==s);else state.prefs.push(s);save();render()}
function selectAll(){state.prefs=[...sports];save();render()}
function resetAll(){if(confirm("Alle voortgang wissen?")){localStorage.removeItem(key);location.reload()}}
function selectedChallengeCount(){
 const selected=state.prefs;
 if(!selected.length) return 0;
 return challenges.filter(c=>selected.includes(c[1])).length;
}
function renderProfile(){
 document.getElementById("profile").innerHTML=`
 <section class="card"><h2>👤 Profiel</h2><p class="muted"><b>${selectedChallengeCount().toLocaleString("nl-NL")}</b> challenges passen bij je geselecteerde categorieën.</p>
 <h3>Favoriete categorieën</h3>${sports.map(s=>`<button class="sport ${state.prefs.includes(s)?"selected":""}" onclick="toggleSport('${s}')">${s}</button>`).join("")}
 <br><button class="secondary" style="margin-top:10px" onclick="selectAll()">Alle categorieën</button></section>
 <section class="card"><h3>Statistieken</h3><p>🏆 ${state.total} voltooid</p><p>🔥 ${state.longest} dagen langste streak</p><p>⭐ ${state.points} punten</p></section>
 <section class="card"><h3>Reset</h3><button class="danger" onclick="resetAll()">Reset voortgang</button></section>`;
}
function render(){renderToday();renderChallenges();renderProgress();renderLevels();renderProfile()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(b.dataset.page).classList.add("active");render();
});
render();
</script>
</body>
</html>
